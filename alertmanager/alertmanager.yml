global:
  resolve_timeout: 5m

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "webhook-backend"
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: "critical-alerts"
      match:
        severity: "critical"
      group_wait: 5s
      repeat_interval: 1h
      continue: true
    - receiver: "warning-alerts"
      match:
        severity: "warning"
      group_wait: 15s
      repeat_interval: 4h
      continue: true
    - receiver: "webhook-backend"
      match_re:
        alertname: ".*"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]

receivers:
  - name: "webhook-backend"
    webhook_configs:
      - url: "http://backend:8000/webhook/alertmanager"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://backend:8000/webhook/alertmanager"
        send_resolved: true

  - name: "warning-alerts"
    webhook_configs:
      - url: "http://backend:8000/webhook/alertmanager"
        send_resolved: true
