global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          environment: "monitoring"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          hostname: "host-laptop"
          tier: "monitoring"
          environment: "management"
      - targets: ["app-server-01:9100"]
        labels:
          hostname: "app-server-01"
          tier: "web"
          environment: "production"
      - targets: ["app-server-02:9100"]
        labels:
          hostname: "app-server-02"
          tier: "api"
          environment: "production"
      - targets: ["db-server-01:9100"]
        labels:
          hostname: "db-server-01"
          tier: "database"
          environment: "production"

  - job_name: "fastapi-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "monitoring"
