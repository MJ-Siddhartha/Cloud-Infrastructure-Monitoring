groups:
  - name: cpu_alerts
    interval: 15s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 50
        for: 15s
        labels:
          severity: warning
          category: cpu
        annotations:
          summary: "High CPU usage detected on {{ $labels.instance }}"
          description: "CPU utilization on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}%, exceeding the 50% warning threshold."
          current_value: "{{ $value | printf \"%.1f\" }}%"
          recommended_action: "Investigate high CPU processes using 'top' or 'htop'. Consider scaling horizontally or optimizing CPU-intensive workloads."

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 75
        for: 15s
        labels:
          severity: critical
          category: cpu
        annotations:
          summary: "Critical CPU usage detected on {{ $labels.instance }}"
          description: "CPU utilization on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}%, exceeding the 75% critical threshold."
          current_value: "{{ $value | printf \"%.1f\" }}%"
          recommended_action: "Immediate action required. Identify and terminate or throttle runaway processes. Consider emergency scaling or load shedding."
